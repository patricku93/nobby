name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must look like v1.2.3, got '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOBBY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "NOBBY_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nobby-release.jks"

      - name: Test and build signed APK
        env:
          NOBBY_VERSION_NAME: ${{ steps.version.outputs.name }}
          NOBBY_VERSION_CODE: ${{ steps.version.outputs.code }}
          NOBBY_KEYSTORE_FILE: ${{ runner.temp }}/nobby-release.jks
          NOBBY_KEYSTORE_PASSWORD: ${{ secrets.NOBBY_KEYSTORE_PASSWORD }}
          NOBBY_KEY_ALIAS: ${{ secrets.NOBBY_KEY_ALIAS }}
          NOBBY_KEY_PASSWORD: ${{ secrets.NOBBY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk NoBby.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NoBby ${{ steps.version.outputs.name }}
          files: NoBby.apk
          generate_release_notes: true
